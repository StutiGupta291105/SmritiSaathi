name: smriti_assist
description: Offline-first cognitive engagement and memory assistance app for elderly users (non-diagnostic).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite_sqlcipher: ^3.1.0   # AES-encrypted local DB (CERT-In: encryption at rest, offline too)
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2  # DB key lives in Android Keystore / iOS Keychain
  uuid: ^4.4.0
  crypto: ^3.0.3                 # SHA-256 hash chain for tamper-evident audit log
  flutter_local_notifications: ^17.2.2  # on-device reminders, work offline
  flutter_tts: ^4.0.2            # on-device text-to-speech for spoken instructions
  image_picker: ^1.1.2           # optional photos (stored inside the encrypted DB)
  permission_handler: ^12.0.1    # phone and location permission prompts
  url_launcher: ^6.3.1           # tap-to-call family (opens the phone dialer)
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3   # runs AppDatabase tests on a desktop SQLite
  flutter_launcher_icons: ^0.14.4  # generates the Android launcher icon from the logo

flutter_launcher_icons:
  android: true
  ios: false   # the APK workflow generates only the Android project
  image_path: assets/images/logo_icon.png
  adaptive_icon_background: "#FBF7EE"
  adaptive_icon_foreground: assets/images/logo_foreground.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Poppins   # bundled (SIL Open Font License), so it works offline
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
