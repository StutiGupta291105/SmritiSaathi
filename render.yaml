# One-click test server on Render (https://render.com): a web service built from
# backend/Dockerfile plus a free PostgreSQL database.
#
# TEST ONLY. The login code is always 123456 (SMRITI_SMS_PROVIDER=test), so use
# made-up names and numbers. Real use needs a real SMS provider and
# SMRITI_ENV=prod; see docs/DEPLOYMENT.md.
services:
  - type: web
    name: smriti-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest Render region to India
    healthCheckPath: /healthz
    envVars:
      - key: SMRITI_ENV
        value: dev
      - key: SMRITI_SMS_PROVIDER
        value: test
      - key: SMRITI_TRUST_PROXY
        value: "true"
      - key: SMRITI_OTP_PER_HOUR_PHONE
        value: "50"
      - key: SMRITI_OTP_PER_HOUR_IP
        value: "200"
      # Talk to Smriti: a free AI through Google Gemini's chat endpoint. Get a free
      # key at https://aistudio.google.com/apikey and paste it in the Render
      # dashboard (Environment > SMRITI_COMPANION_API_KEY). Without a key the app
      # uses its small on-device helper. To use another service (Groq, a paid
      # Anthropic key...) see docs/DEPLOYMENT.md.
      - key: SMRITI_COMPANION_PROVIDER
        value: openai_compat
      - key: SMRITI_COMPANION_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: SMRITI_COMPANION_MODEL
        value: gemini-flash-latest
      - key: SMRITI_COMPANION_API_KEY
        sync: false
      - key: SMRITI_SECRET_KEY
        generateValue: true
      - key: SMRITI_PHONE_HMAC_KEY
        generateValue: true
      - key: SMRITI_DATABASE_URL
        fromDatabase:
          name: smriti-db
          property: connectionString

databases:
  - name: smriti-db
    plan: free
    region: singapore
