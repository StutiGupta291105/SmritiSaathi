name: smriti_admin
description: Read-only admin portal for Smriti Sathi (desktop). Monitors users, who supervises whom, and the access log; it cannot change anything.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
