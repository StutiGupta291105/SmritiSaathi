name: Build Android APK

# Builds an installable APK on GitHub's servers, so no local Android setup is
# needed. Download it from the run's "Artifacts" section and open it on a phone.
# The APK is signed with the debug key: fine for testing, NOT for the Play Store.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Pinned on purpose. Newer Flutter generates an Android project that uses
      # Android Gradle Plugin 9, which removed `lintOptions`; sqflite_sqlcipher
      # (our encrypted database) still uses it, so the build breaks. Move this
      # forward only after that plugin supports AGP 9.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name smriti_assist --platforms android
      - name: Remove the generated sample test (it targets a class we do not have)
        run: rm -f test/widget_test.dart
      - name: Apply Android settings
        run: python3 .github/scripts/patch_android.py
      - run: flutter pub get
      - name: Generate the launcher icon from the logo
        run: dart run flutter_launcher_icons
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
