name: Build Android APK

# Builds an installable APK on GitHub's servers, so no local Android setup is
# needed. Download it from the run's "Artifacts" section and open it on a phone.
# The APK is signed with the debug key: fine for testing, NOT for the Play Store.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # Pinned on purpose. Newer Flutter generates an Android project that uses
      # Android Gradle Plugin 9, which removed `lintOptions`; sqflite_sqlcipher
      # (our encrypted database) still uses it, so the build breaks. Move this
      # forward only after that plugin supports AGP 9.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create . --project-name smriti_assist --platforms android
      - name: Remove the generated sample test (it targets a class we do not have)
        run: rm -f test/widget_test.dart
      - name: Apply Android settings
        run: python3 .github/scripts/patch_android.py
      - run: flutter pub get
      # Optional: sign with your own key when these repository secrets exist
      # (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD). Without them the APK is signed with a debug key,
      # fine for testing but not for the Play Store.
      - name: Release signing (if a key is configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SMRITI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMRITI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMRITI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SMRITI_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SMRITI_KEYSTORE_PASSWORD=$SMRITI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SMRITI_KEY_ALIAS=$SMRITI_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SMRITI_KEY_PASSWORD=$SMRITI_KEY_PASSWORD" >> "$GITHUB_ENV"
            SMRITI_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" python3 .github/scripts/sign_android.py
          else
            echo "No signing key configured; using the debug key."
          fi
      - name: Generate the launcher icon from the logo
        run: dart run flutter_launcher_icons
      - run: flutter test
      # API_BASE_URL is a repository variable (Settings > Secrets and variables >
      # Actions > Variables). When it is unset the APK points at the Render test
      # server; set it to another address to override.
      - name: Build the APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://smriti-api-227e.onrender.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: smriti-sathi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
