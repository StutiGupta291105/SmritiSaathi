name: Check test server

# Looks at the live test server (health, privacy policy, account-deletion page)
# without creating any data. Runs when its request file changes.
on:
  push:
    paths: [".github/check-test-server-request.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look at the server
        run: |
          B=https://smriti-api-227e.onrender.com
          for p in /healthz /privacy /delete-account; do
            for i in 1 2 3 4 5 6; do
              c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$B$p" || true)
              echo "$p -> $c"
              [ "$c" = "200" ] && break
              sleep 20
            done
          done
          curl -s --max-time 60 $B/healthz; echo
