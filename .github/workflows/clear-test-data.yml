name: Clear test data

# Empties every table of the test server's database (rows only: the database,
# tables and schema stay). Start it by hand from the Actions tab and type
# CLEAR in the box. Needs the repository secret SMRITI_DATABASE_URL set to the
# Render database's External Database URL. Not for real patient data.
on:
  # Also runs when the request file below is changed on a branch, because a
  # hand-started run only works for workflows already on the default branch.
  push:
    paths: [".github/clear-test-data-request.txt"]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type CLEAR to delete every row in the test database"
        required: false

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check confirmation
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            [ "$(tr -d '[:space:]' < .github/clear-test-data-request.txt)" = "CLEAR" ] || { echo "Request file must contain CLEAR."; exit 1; }
          else
            [ "${{ github.event.inputs.confirm }}" = "CLEAR" ] || { echo "Type CLEAR to confirm."; exit 1; }
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install server requirements
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Delete all rows
        working-directory: backend
        env:
          SMRITI_DATABASE_URL: ${{ secrets.SMRITI_DATABASE_URL }}
          SMRITI_ENV: development
        run: |
          test -n "$SMRITI_DATABASE_URL" || { echo "Add the SMRITI_DATABASE_URL repository secret first."; exit 1; }
          python -m app.cli wipe-all-data I-UNDERSTAND
          python -m app.cli verify-audit
