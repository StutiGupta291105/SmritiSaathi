name: Keep test server warm

# A free Render service sleeps after ~15 minutes without traffic and then takes
# up to a minute to wake. This pings it every 10 minutes so the first request of
# a demo or a test is fast. Scheduled workflows only run from the default branch.
# Set the repository variable API_URL to point elsewhere; stop it by disabling
# this workflow.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          API_URL: ${{ vars.API_URL || 'https://smriti-api-227e.onrender.com' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 70 "$API_URL/healthz" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          exit 1
